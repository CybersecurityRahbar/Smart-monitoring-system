[platformio]
default_envs = esp32cam_ai_thinker

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  espressif/esp32-camera @ ^2.0.5
build_flags =
  -D CORE_DEBUG_LEVEL=1

[env:esp32cam_ai_thinker]
platform = espressif32
board = esp32cam
build_flags =
  ${env.build_flags}
  -D SMARTTRAFFIC_CAMERA_AI_THINKER

[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.psram_type = opi
build_flags =
  ${env.build_flags}
  -D SMARTTRAFFIC_CAMERA_S3_N16R8
