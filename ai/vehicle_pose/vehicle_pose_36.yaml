# Dataset contract for the final calibration-free vehicle keypoint model.
# Semantic keypoint names/order are intentionally not filled in until the paper's
# 36-point metric template is frozen as a machine-readable annotation schema.
path: vehicle_pose_36
train: images/train
val: images/val

# One vehicle class, 36 keypoints, x/y + visibility.
kpt_shape: [36, 3]

# Do not enable horizontal-flip augmentation until a verified left/right flip map exists.
names:
  0: vehicle

kpt_names:
  0:
    - template_kp_00
    - template_kp_01
    - template_kp_02
    - template_kp_03
