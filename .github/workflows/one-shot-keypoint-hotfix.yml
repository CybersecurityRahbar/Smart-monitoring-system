import kotlin.math.abs
import kotlin.math.hypot
import kotlin.math.max
import kotlin.math.min
import kotlin.math.sqrt

/** A metric 2D point belonging to the canonical vehicle template. */
data class VehicleMetricTemplatePoint(
    val name: String,
    val xMeters: Double,
    val yMeters: Double,
) {
    init {
        require(name.isNotBlank())
        require(xMeters.isFinite() && yMeters.isFinite())
    }
}

/**
 * Machine-readable 36-keypoint metric template contract.
 *
 * The 2026 paper defines a sedan-based metric template with 36 semantic points and a 3 m
 * wheelbase, but its Figure 4 does not publish a machine-readable coordinate table. Therefore this
 * repository requires the exact coordinate table to be supplied explicitly and marks the template
 * as verified/unverified. The runtime refuses an unverified template for dynamic speed.
 */
data class VehicleMetricTemplate36(
    val points: List<VehicleMetricTemplatePoint>,
    val planarFacets: List<List<String>>,
    val verified: Boolean,
    val source: String,
) {
    private val byName = points.associateBy { it.name }

    init {
        require(points.size == 36) { "A 36-point vehicle template must contain exactly 36 points" }
        require(byName.size == 36) { "Vehicle template point names must be unique" }
        require(source.isNotBlank())
        require(planarFacets.isNotEmpty())
        planarFacets.forEach { facet ->
            require(facet.distinct().size == facet.size) { "Facet keypoint names must be unique" }
            require(facet.size >= 4) { "Each planar facet needs at least 4 points" }
            require(facet.all(byName::containsKey)) { "Facet references an unknown template point" }
            require(!isCollinear(facet.mapNotNull(byName::get))) { "A planar facet cannot be collinear" }
        }
    }

    fun point(name: String): VehicleMetricTemplatePoint? = byName[name]

    private fun isCollinear(points: List<VehicleMetricTemplatePoint>): Boolean {
        if (points.size < 3) return true
        val a = points[0]
        var maxArea = 0.0
        for (i in 1 until points.lastIndex) {
            for (j in i + 1 until points.size) {
                val b = points[i]
                val c = points[j]
                val area = abs((b.xMeters - a.xMeters) * (c.yMeters - a.yMeters) - (b.yMeters - a.yMeters) * (c.xMeters - a.xMeters))
                maxArea = max(maxArea, area)
            }
        }
        return maxArea < 1e-9
    }
}

/**
 * Sparse semantic-keypoint implementation of the paper's Eq. (4): H_k maps image points in frame
 * k to a metric vehicle facet. The same H_k is applied to the matched point in frame k+1, then
 * point-wise metric velocities are robustly aggregated across all valid matched semantic points.
 */
object VehicleKeypointMetricSpeedEstimator {
    private const val KEYPOINT_CONFIDENCE = 0.25
    private const val HOMOGRAPHY_THRESHOLD_METERS = 0.08
    private const val MAX_INTERVAL_SECONDS = 0.60
    private const val MIN_SPEED_MPS = 0.0
    private const val KMH = 3.6

    fun estimate(
        track: Track,
        template: VehicleMetricTemplate36,
        minimumSamples: Int,
        minimumDurationMs: Long,
        maxPlausibleSpeedKmh: Double,
        maximumObservationGapMs: Long,
    ): SpeedEstimate? {
        if (!template.verified) return null
        if (track.state != TrackState.CONFIRMED) return null
        if (track.observations.size < minimumSamples) return null

        val observations = track.observations.sortedWith(compareBy<TrackObservation> { it.timestampMs }.thenBy { it.frameIndex })
        if (observations.last().timestampMs - observations.first().timestampMs < minimumDurationMs) return null

        val intervalSpeeds = mutableListOf<Double>()
        var intervalConfidence = 0.0
        var intervalCount = 0
        var totalPairs = 0
        var usablePairs = 0

        for (index in 1 until observations.size) {
            val previous = observations[index - 1]
            val current = observations[index]
            val dt = (current.timestampMs - previous.timestampMs) / 1000.0
            totalPairs++
            if (!dt.isFinite() || dt <= 0.0 || dt > MAX_INTERVAL_SECONDS || (current.timestampMs - previous.timestampMs) > maximumObservationGapMs) continue

            val previousByName = previous.keypoints.associateBy { it.name }
            val currentByName = current.keypoints.associateBy { it.name }
            val facetCandidates = template.planarFacets.mapNotNull { facetNames ->
                val correspondences = facetNames.mapNotNull { name ->
                    val image = previousByName[name]
                    val metric = template.point(name)
                    if (image == null || metric == null || image.confidence < KEYPOINT_CONFIDENCE) null
                    else VehicleTemplateCorrespondence(
                        keypointName = name,
                        imageX = image.x,
                        imageY = image.y,
                        templateX = metric.xMeters,
                        templateY = metric.yMeters,
                        confidence = image.confidence.toDouble(),
                    )
                }
                if (correspondences.size < 4) null else VehicleKeypointHomography.estimate(
                    correspondences,
                    reprojectionThreshold = HOMOGRAPHY_THRESHOLD_METERS,
                    maxIterations = 80,
                    minimumInliers = 4,
                )?.let { it to facetNames }
            }
            if (facetCandidates.isEmpty()) continue

            var bestFacetSpeed: Double? = null
            var bestFacetConfidence = 0.0
            for ((fit, facetNames) in facetCandidates) {
                val pointSpeeds = facetNames.mapNotNull { name ->
                    val a = previousByName[name] ?: return@mapNotNull null
                    val b = currentByName[name] ?: return@mapNotNull null
                    if (a.confidence < KEYPOINT_CONFIDENCE || b.confidence < KEYPOINT_CONFIDENCE) return@mapNotNull null
                    val pa = fit.project(a.x, a.y)
                    val pb = fit.project(b.x, b.y)
                    if (!pa.x.isFinite() || !pa.y.isFinite() || !pb.x.isFinite() || !pb.y.isFinite()) return@mapNotNull null
                    val distance = hypot(pb.x - pa.x, pb.y - pa.y)
                    if (!distance.isFinite()) null else distance / dt
                }.filter { it.isFinite() && it >= MIN_SPEED_MPS && it * KMH <= maxPlausibleSpeedKmh * 1.25 }
                if (pointSpeeds.size < 3) continue
                val facetSpeed = robustMedian(pointSpeeds)
                val confidence = (
                    (fit.inlierMask.count { it }.toDouble() / fit.inlierMask.size.toDouble()) *
                        expPenalty(fit.medianReprojectionError) *
                        min(1.0, pointSpeeds.size / facetNames.size.toDouble())
                    ).coerceIn(0.0, 1.0)
                if (confidence > bestFacetConfidence) {
                    bestFacetConfidence = confidence
                    bestFacetSpeed = facetSpeed
                }
            }

            if (bestFacetSpeed != null) {
                intervalSpeeds += bestFacetSpeed
                intervalConfidence += bestFacetConfidence
                intervalCount++
                usablePairs++
            }
        }

        if (intervalSpeeds.size < max(4, minimumSamples / 2)) return null
        val sorted = intervalSpeeds.sorted()
        val trim = if (sorted.size >= 10) (sorted.size * 0.10).toInt() else 0
        val trimmed = if (trim > 0 && sorted.size - 2 * trim >= 4) sorted.subList(trim, sorted.size - trim) else sorted
        val metersPerSecond = robustMedian(trimmed)
        val kmh = metersPerSecond * KMH
        if (!kmh.isFinite() || kmh < 0.0 || kmh > maxPlausibleSpeedKmh) return null

        val median = robustMedian(trimmed)
        val mad = robustMedian(trimmed.map { abs(it - median) })
        val errorKmh = (1.4826 * mad * KMH).coerceAtLeast(0.0)
        val confidence = (intervalConfidence / intervalCount.coerceAtLeast(1)).toFloat().coerceIn(0f, 1f)
        val durationMs = observations.last().timestampMs - observations.first().timestampMs
        val fallbackDirection = directionDegrees(observations)

        return SpeedEstimate(
            metersPerSecond = metersPerSecond,
            kilometersPerHour = kmh,
            confidence = confidence,
            sampleCount = intervalSpeeds.size,
            durationMs = durationMs,
            directionDegrees = fallbackDirection,
            errorKmh = errorKmh,
            estimatorLabel = "36-keypoint dynamic homography (sparse semantic points)",
            mode = SpeedEstimateMode.CALIBRATION_FREE_ESTIMATE,
        )
    }

    private fun robustMedian(values: List<Double>): Double {
        val sorted = values.filter { it.isFinite() }.sorted()
        if (sorted.isEmpty()) return Double.NaN
        val mid = sorted.size / 2
        return if (sorted.size % 2 == 0) (sorted[mid - 1] + sorted[mid]) * 0.5 else sorted[mid]
    }

    private fun expPenalty(errorMeters: Double): Double =
        (1.0 / (1.0 + errorMeters / 0.04)).coerceIn(0.0, 1.0)

    private fun directionDegrees(observations: List<TrackObservation>): Double? {
        val deltas = observations.zipWithNext().mapNotNull { (a, b) ->
            val dt = (b.timestampMs - a.timestampMs) / 1000.0
            if (!dt.isFinite() || dt <= 0.0) null else {
                val ax = (a.keypoints.map { it.x }.average())
                val ay = (a.keypoints.map { it.y }.average())
                val bx = (b.keypoints.map { it.x }.average())
                val by = (b.keypoints.map { it.y }.average())
                val dx = bx - ax
                val dy = by - ay
                if (hypot(dx, dy) < 1e-6) null else Math.toDegrees(kotlin.math.atan2(dy, dx))
            }
        }
        return deltas.takeIf { it.isNotEmpty() }?.let { robustMedian(it) }
    }
}
''')

